databases:
  - name: plcc-sanctum-postgres
    plan: basic-256mb
    databaseName: plcc_sanctum
    user: plcc_sanctum

services:
  - type: web
    name: plcc-sanctum
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DEPLOY_ENV
        value: staging
      - key: ALLOW_PLACEHOLDER
        value: "true"
      # Pool settings (connection_limit / pool_timeout) are added in server/prisma.ts.
      - key: DATABASE_URL
        fromDatabase:
          name: plcc-sanctum-postgres
          property: connectionString
      - key: SANCTUM_MODE
        value: church
      - key: PUBLIC_SITE_URL
        value: https://plcc-opal.vercel.app
      - key: PUBLIC_SITE_ORIGINS
        value: https://plcc-opal.vercel.app,https://sanctum-live-nine.vercel.app
      # Render's address for this service. If Render gives a different one, change it here.
      - key: APP_URL
        value: https://plcc-sanctum.onrender.com
      - key: CRON_SECRET
        generateValue: true
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GALLERY_REVIEW_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT_API
        sync: false
      - key: SENTRY_PROJECT_SANCTUM
        sync: false

  - type: cron
    name: plcc-sanctum-youtube-import
    runtime: node
    schedule: "0 */6 * * *"
    buildCommand: node -e "process.exit(0)"
    startCommand: node scripts/youtube-cron.mjs
    envVars:
      - key: CRON_SECRET
        fromService:
          name: plcc-sanctum
          type: web
          envVarKey: CRON_SECRET
      - key: APP_URL
        fromService:
          name: plcc-sanctum
          type: web
          envVarKey: APP_URL
